apiVersion: v2
appVersion: "8.2"
dependencies:
- condition: fabric.enabled
  name: fabric
  repository: file://../fabric
  version: '*'
- alias: postgres
  condition: postgres.enabled
  name: generic-db
  repository: file://../generic-db
  version: '*'
- alias: cassandra
  condition: cassandra.enabled
  name: generic-db
  repository: file://../generic-db
  version: '*'
- alias: kafka
  condition: kafka.enabled
  name: generic-db
  repository: file://../generic-db
  version: '*'
- alias: neo4j
  condition: neo4j.enabled
  name: generic-db
  repository: file://../generic-db
  version: '*'
- alias: DB2
  condition: DB2.enabled
  name: generic-db
  repository: file://../generic-db
  version: '*'
description: The following Helm Chart Deploys Fabric and Generic DB
name: fabric-space-generic
type: application
version: 1.1.21
